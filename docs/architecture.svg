<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b06a2c"/>
    </marker>
  </defs>

  <rect width="900" height="730" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">
    ad-planner 架构：自然语言 → 数学模型 → 求解 → 独立验证
  </text>

  <!-- ============ 主链路 ============ -->

  <!-- 用户输入 -->
  <rect x="190" y="50" width="400" height="58" rx="8" fill="#eef2f7" stroke="#b9c7d6" stroke-width="1.5"/>
  <text x="390" y="75" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">用户输入</text>
  <text x="390" y="95" text-anchor="middle" font-size="12" fill="#57606a">自然语言描述的整数规划问题</text>

  <line x1="390" y1="108" x2="390" y2="136" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- C++ Agent 主循环 -->
  <rect x="190" y="138" width="400" height="62" rx="8" fill="#e8f1fc" stroke="#7aa7d9" stroke-width="1.5"/>
  <text x="390" y="162" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">
    C++ Agent 主循环　main.cpp
  </text>
  <text x="390" y="183" text-anchor="middle" font-size="12" fill="#57606a">
    编排建模 → 求解 → 验证，失败则带着原因重试
  </text>

  <line x1="390" y1="200" x2="390" y2="228" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="402" y="219" font-size="11.5" fill="#57606a">① 调用 LLM 建模</text>

  <!-- LLM 建模 -->
  <rect x="190" y="230" width="400" height="62" rx="8" fill="#e8f1fc" stroke="#7aa7d9" stroke-width="1.5"/>
  <text x="390" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">
    llm_client.cpp　→　solver/llm_call.py
  </text>
  <text x="390" y="275" text-anchor="middle" font-size="12" fill="#57606a">
    API Key 走环境变量，不出现在命令行
  </text>

  <line x1="590" y1="261" x2="628" y2="261" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="630" y="230" width="250" height="62" rx="8" fill="#fdf4e3" stroke="#dfb46f" stroke-width="1.5"/>
  <text x="755" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">
    外部 LLM 服务
  </text>
  <text x="755" y="275" text-anchor="middle" font-size="12" fill="#57606a">
    SiliconFlow API · DeepSeek-V3
  </text>

  <line x1="390" y1="292" x2="390" y2="320" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="402" y="311" font-size="11.5" fill="#57606a">② 解析 JSON 模型</text>

  <!-- 模型解析 -->
  <rect x="190" y="322" width="400" height="62" rx="8" fill="#e8f1fc" stroke="#7aa7d9" stroke-width="1.5"/>
  <text x="390" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">
    model_parser.cpp
  </text>
  <text x="390" y="367" text-anchor="middle" font-size="12" fill="#57606a">
    提取 变量 v / 约束 c / 目标 o / 类型 t
  </text>

  <line x1="390" y1="384" x2="390" y2="412" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="402" y="403" font-size="11.5" fill="#57606a">③ 交给求解器</text>

  <!-- 求解 -->
  <rect x="190" y="414" width="400" height="72" rx="8" fill="#e8f6ec" stroke="#6fbf7f" stroke-width="1.5"/>
  <text x="390" y="438" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">
    solver_call.cpp　→　solver/solve.py
  </text>
  <text x="390" y="458" text-anchor="middle" font-size="12" fill="#57606a">
    ast 安全解析表达式（不使用 eval）→ OR-Tools SCIP 求解
  </text>
  <text x="390" y="476" text-anchor="middle" font-size="12" fill="#57606a">
    输出 最优值 / 最优解 / 规范化模型，错误则给出可读原因
  </text>

  <line x1="590" y1="450" x2="628" y2="450" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="630" y="414" width="250" height="72" rx="8" fill="#f2f3f5" stroke="#b9c7d6" stroke-width="1.5"/>
  <text x="755" y="437" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">
    本地运行日志
  </text>
  <text x="755" y="456" text-anchor="middle" font-size="12" fill="#57606a">
    learning_log.cpp
  </text>
  <text x="755" y="474" text-anchor="middle" font-size="11.5" fill="#b06a2c">
    已加入 .gitignore，不进公开仓库
  </text>

  <line x1="390" y1="486" x2="390" y2="514" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="402" y="505" font-size="11.5" fill="#57606a">④ 独立验证</text>

  <!-- 验证 -->
  <rect x="190" y="516" width="400" height="86" rx="8" fill="#f1ecfc" stroke="#a78bda" stroke-width="1.5"/>
  <text x="390" y="540" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">
    verifier.cpp　+　linear_expr.cpp
  </text>
  <text x="390" y="561" text-anchor="middle" font-size="12" fill="#57606a">
    四步验证：结构 → 整数性 → 逐条约束代入 → 目标值重算比对
  </text>
  <text x="390" y="581" text-anchor="middle" font-size="12" fill="#b06a2c">
    修复前这一步只检查了向量长度和 NaN，没有代入任何约束
  </text>

  <line x1="390" y1="602" x2="390" y2="630" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 输出 -->
  <rect x="190" y="632" width="400" height="62" rx="8" fill="#eef2f7" stroke="#b9c7d6" stroke-width="1.5"/>
  <text x="390" y="656" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">
    结果输出
  </text>
  <text x="390" y="677" text-anchor="middle" font-size="12" fill="#57606a">
    最优解 + 目标值 + 验证报告
  </text>

  <!-- ============ 失败反馈回路 ============ -->
  <path d="M 190 559 L 120 559 L 120 169 L 186 169"
        fill="none" stroke="#b06a2c" stroke-width="1.8"
        stroke-dasharray="7 5" marker-end="url(#arrowDash)"/>
  <text x="112" y="364" text-anchor="middle" font-size="12" font-weight="600"
        fill="#b06a2c" transform="rotate(-90 112 364)">
    失败重试（≤3 次）
  </text>
  <text x="112" y="560" text-anchor="middle" font-size="11" fill="#b06a2c"
        transform="rotate(-90 112 560)">
    回填可读原因
  </text>

  <!-- ============ 图例 ============ -->
  <rect x="630" y="544" width="250" height="150" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/>
  <text x="648" y="568" font-size="12.5" font-weight="700" fill="#1f2328">图例</text>

  <rect x="648" y="580" width="14" height="14" rx="3" fill="#e8f1fc" stroke="#7aa7d9" stroke-width="1.4"/>
  <text x="670" y="592" font-size="12" fill="#57606a">C++ 智能层（Agent / 大脑）</text>

  <rect x="648" y="604" width="14" height="14" rx="3" fill="#e8f6ec" stroke="#6fbf7f" stroke-width="1.4"/>
  <text x="670" y="616" font-size="12" fill="#57606a">Python 计算层（纯求解）</text>

  <rect x="648" y="628" width="14" height="14" rx="3" fill="#f1ecfc" stroke="#a78bda" stroke-width="1.4"/>
  <text x="670" y="640" font-size="12" fill="#57606a">独立验证</text>

  <rect x="648" y="652" width="14" height="14" rx="3" fill="#fdf4e3" stroke="#dfb46f" stroke-width="1.4"/>
  <text x="670" y="664" font-size="12" fill="#57606a">外部服务</text>

  <line x1="648" y1="682" x2="662" y2="682" stroke="#b06a2c" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="670" y="686" font-size="12" fill="#57606a">错误反馈回路</text>
</svg>
